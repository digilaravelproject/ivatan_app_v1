# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  lottie: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  video_player: ^2.8.1
  better_player_plus: ^1.0.2
  responsive_sizer: ^3.0.6
  shared_preferences: ^2.5.3
  #intl: ^0.19.0
  image_picker: ^1.2.1
  dio: ^5.9.0
  flutter_image_compress: ^2.3.0
  flutter_animate: ^4.5.2
  flutter_contacts: ^1.1.7
  url_launcher: ^6.3.2
  permission_handler: ^11.3.0
  video_compress: ^3.1.2
  path_provider: ^2.1.2
  photo_view: ^0.14.0
  chewie: ^1.7.1
  fluttertoast: ^8.2.4
  #pusher_client_socket: ^0.0.7
  #pusher_client: ^2.0.0
  pusher_channels_flutter: ^2.2.1
  app_links: ^6.4.1
  share_plus: ^12.0.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  flutter_local_notifications: ^19.4.2
  firebase_messaging: ^16.0.3
  loading_animation_widget: ^1.3.0
  fluttermoji: ^1.0.2
  provider: ^6.1.2
  photo_manager: ^3.5.0
  camerawesome: ^2.5.0
  emoji_picker_flutter: ^4.0.0
  file_picker: ^8.0.0

  # Google Sign In
  google_sign_in: ^6.2.2



  # ffmpeg_kit_flutter_min_gpl: ^6.0.2
  iconly:
  iconify_flutter: ^0.0.7
  intl_phone_field: ^3.2.0
  image_cropper: ^11.0.0
  slide_to_act: ^2.0.2
  rename_app: ^1.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.5.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/imageApplogo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/imageApplogo.jpg"
  min_sdk_android: 21 # android min sdk min:16, default 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/imageApplogo.jpg"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/images/imageApplogo.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/imageApplogo.jpg"


  flutter_lints: ^5.0.0

